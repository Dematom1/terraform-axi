name: metrics

# Daily privacy-safe adoption baseline for the Dematom1 platform AXIs.
# GitHub keeps traffic for only 14 days, so each snapshot is committed as
# snapshots/YYYY-MM-DD.json on the non-default `metrics` branch.
# Reading traffic for all six repos needs the METRICS_TRAFFIC_TOKEN secret:
# a fine-grained token limited to the six repos with "Administration: read".
# Without it, npm stats are still recorded and GitHub traffic is marked skipped.
# The last step fails the run (so GitHub notifies) when a repo's latest GitHub
# release and npm dist-tags.latest have disagreed for more than 24 hours.

on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily; GitHub may delay scheduled runs.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Snapshot
        env:
          METRICS_TRAFFIC_TOKEN: ${{ secrets.METRICS_TRAFFIC_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$METRICS_TRAFFIC_TOKEN" ]; then
            echo "::warning::METRICS_TRAFFIC_TOKEN is not set; GitHub traffic is skipped, npm stats are still recorded."
          fi
          node scripts/metrics-snapshot.mjs > "$RUNNER_TEMP/snapshot.json"
      - name: Commit to the metrics branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          date=$(node -p 'require(process.argv[1]).date' "$RUNNER_TEMP/snapshot.json")
          dir="$RUNNER_TEMP/metrics"
          git init -q "$dir"
          cd "$dir"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          if git -c http.extraheader="$auth" ls-remote --exit-code --heads origin metrics >/dev/null; then
            git -c http.extraheader="$auth" fetch -q --depth=1 origin metrics
            git checkout -q -b metrics FETCH_HEAD
          else
            status=$?
            [ "$status" -eq 2 ] || exit "$status"
            git checkout -q --orphan metrics
          fi
          mkdir -p snapshots
          cp "$RUNNER_TEMP/snapshot.json" "snapshots/$date.json"
          git add snapshots
          if git diff --cached --quiet; then
            echo "No change for $date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "chore(metrics): snapshot $date"
          git -c http.extraheader="$auth" push -q origin metrics
      - name: Check GitHub releases match npm latest
        run: node scripts/metrics-snapshot.mjs --check-releases "$RUNNER_TEMP/snapshot.json"
